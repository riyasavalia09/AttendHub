<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | AttendHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Recursive:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboard_glass.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/ui_glass_overlay.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/toast.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top solid" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-clipboard-check me-2"></i>AttendHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/#features">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/#plans">Plans</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="loginDropdown" role="button" data-bs-toggle="dropdown">
                            Login
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/admin/login"><i class="fas fa-user-shield me-2"></i>Admin Login</a></li>
                            <li><a class="dropdown-item active" href="/faculty/login"><i class="fas fa-chalkboard-teacher me-2"></i>Faculty Login</a></li>
                            <li><a class="dropdown-item" href="/student/login"><i class="fas fa-user-graduate me-2"></i>Student Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title text-center mb-4">Faculty Login</h2>
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-chalkboard-teacher fa-3x" style="color: #6CB1DA;"></i>
                    <p class="text-white mt-3 mb-0">Access faculty dashboard</p>
                </div>
                
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="loginId" class="form-label text-white">Email Address</label>
                        <input type="email" class="form-control" id="loginId" placeholder="faculty@university.edu" required>
                        <div class="error-message"></div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-white">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="d-flex justify-content-end mb-3">
                        <a class="text-white" href="/forgot-password?role=faculty"><small>Forgot password?</small></a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                    
                    <div class="text-center">
                        <p class="text-white mb-2"><small>Faculty accounts are created by university admin</small></p>
                        <p class="text-white mb-0"><small>Contact admin if you don't have access</small></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='JS/api.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/auth.js') }}"></script>
</body>
</html>
