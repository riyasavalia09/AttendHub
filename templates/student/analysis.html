<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Analysis | AttendHub Student</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Recursive:wght@300..800&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboard_glass.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='CSS/ui_glass_overlay.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='CSS/toast.css') }}">
</head>
<body>

	<nav class="navbar navbar-expand-lg navbar-academic fixed-top">
		<div class="container-fluid">
			<button class="btn me-3" id="menu-toggle" type="button" aria-label="Toggle sidebar">
				<i class="fas fa-bars"></i>
			</button>
			<a class="navbar-brand" href="#">
				<i class="fas fa-user-graduate me-2"></i>AttendHub Student
			</a>

			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
					<li class="nav-item me-2">
						<button class="btn btn-sm btn-action" id="themeToggle" type="button" aria-pressed="false">
							<i class="fas fa-sun"></i>
						</button>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<img id="studentAvatarTop" src="https://ui-avatars.com/api/?name=Student+User&background=random" alt="User" class="rounded-circle me-2" width="32" height="32">
							<span id="studentNameTop" class="d-none d-lg-inline small">Student</span>
						</a>
						<ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="navbarDropdown">
							<li><a class="dropdown-item" href="/student/profile"><i class="fas fa-user me-2"></i>My Profile</a></li>
							<li><hr class="dropdown-divider"></li>
							<li><a class="dropdown-item text-danger logout-action" href="#"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div id="wrapper">
		<div id="sidebar-wrapper">
			<div class="sidebar-heading">Menu</div>
			<div class="list-group list-group-flush">
				<a href="/student/dashboard" class="list-group-item list-group-item-action">
					<i class="fas fa-tachometer-alt"></i> Dashboard
				</a>
				<a href="/student/profile" class="list-group-item list-group-item-action">
					<i class="fas fa-id-card"></i> My Profile
				</a>
				<a href="/student/attendance" class="list-group-item list-group-item-action">
					<i class="fas fa-calendar-check"></i> My Attendance
				</a>
				<a href="/student/analysis" class="list-group-item list-group-item-action active">
					<i class="fas fa-chart-column"></i> Analysis
				</a>
				<a href="/student/timetable" class="list-group-item list-group-item-action">
					<i class="fas fa-table"></i> Timetable
				</a>
				<a href="/student/history" class="list-group-item list-group-item-action">
					<i class="fas fa-history"></i> Attendance History
				</a>
				<a href="/student/reports" class="list-group-item list-group-item-action">
					<i class="fas fa-file-alt"></i> Reports
				</a>
			</div>
		</div>

		<div id="page-content-wrapper">
			<div class="container-fluid px-4 py-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<div class="text-white">
						<h2 class="h4 mb-0 fw-bold">Analysis</h2>
						<p class="mb-0 small opacity-75">Insights across your attendance</p>
					</div>
					<div class="d-flex align-items-center gap-2">
						<span id="analysisOverallStatusBadge" class="badge bg-secondary">—</span>
						<span id="analysisOverallPctText" class="text-white small">—%</span>
					</div>
				</div>

				<div class="card-academic mb-4">
					<div class="card-academic-header">
						<span><i class="fas fa-sliders me-2"></i>Filters</span>
						<span id="analysisFilterSummary" class="small text-muted">No filters applied</span>
					</div>
					<div class="p-3">
						<div class="row g-3 align-items-end">
							<div class="col-md-4">
								<label class="form-label">Subject</label>
								<select id="analysisSubjectFilter" class="form-select">
									<option value="">All Subjects</option>
								</select>
							</div>
							<div class="col-md-3">
								<label class="form-label">From</label>
								<input id="analysisFromDate" type="date" class="form-control" />
							</div>
							<div class="col-md-3">
								<label class="form-label">To</label>
								<input id="analysisToDate" type="date" class="form-control" />
							</div>
							<div class="col-md-2 d-grid">
								<button id="analysisApplyBtn" class="btn btn-action" type="button">
									<i class="fas fa-filter me-2"></i>Apply
								</button>
							</div>
							<div class="col-md-2 d-grid">
								<button id="analysisResetBtn" class="btn btn-outline-light" type="button">Reset</button>
							</div>
						</div>
					</div>
				</div>

				<div class="row g-4">
					<div class="col-lg-4">
						<div class="card-academic p-3 h-100">
							<div class="d-flex justify-content-between align-items-center mb-2">
								<div class="fw-bold text-white">Overall</div>
								<div class="small text-muted">Donut</div>
							</div>
							<div style="height: 260px;">
								<canvas id="analysisOverallDonutChart"></canvas>
							</div>
						</div>
					</div>
					<div class="col-lg-8">
						<div class="card-academic p-3 h-100">
							<div class="d-flex justify-content-between align-items-center mb-2">
								<div class="fw-bold text-white">Subject Comparison</div>
								<div class="small text-muted">Radar</div>
							</div>
							<div style="height: 260px;">
								<canvas id="analysisSubjectRadarChart"></canvas>
							</div>
						</div>
					</div>
				</div>

				<div class="card-academic mt-4 p-3">
					<div class="d-flex justify-content-between align-items-center mb-2">
						<div class="fw-bold text-white">Recent Trend</div>
						<div class="small text-muted">Avg: <span id="analysisRecentAvgText">—</span></div>
					</div>
					<div style="height: 280px;">
						<canvas id="analysisRecentTrendChart"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="{{ url_for('static', filename='JS/api.js') }}"></script>
	<script src="{{ url_for('static', filename='JS/student_layout.js') }}"></script>
	<script src="{{ url_for('static', filename='JS/glass_ui.js') }}"></script>
	<script src="{{ url_for('static', filename='JS/logout.js') }}"></script>
	<script src="{{ url_for('static', filename='JS/student_analysis.js') }}"></script>
</body>
</html>
