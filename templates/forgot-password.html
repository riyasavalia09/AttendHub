<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AttendHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Recursive:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/dashboard_glass.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/ui_glass_overlay.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/toast.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top solid" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-clipboard-check me-2"></i>AttendHub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="loginDropdown" role="button" data-bs-toggle="dropdown">Login</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/admin/login"><i class="fas fa-user-shield me-2"></i>Admin Login</a></li>
                            <li><a class="dropdown-item" href="/faculty/login"><i class="fas fa-chalkboard-teacher me-2"></i>Faculty Login</a></li>
                            <li><a class="dropdown-item" href="/student/login"><i class="fas fa-user-graduate me-2"></i>Student Login</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 760px;">
            <h2 class="auth-title text-center mb-4">Password Recovery</h2>

            <div class="glass-card p-4 p-md-5">
                <div class="row g-4">
                    <div class="col-12 col-lg-6">
                        <h5 class="text-white mb-3"><i class="fas fa-envelope me-2"></i>Request reset token</h5>
                        <form id="forgotPasswordForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label text-white">Role</label>
                                <select class="form-select" id="fpRole" required>
                                    <option value="admin">Admin</option>
                                    <option value="faculty">Faculty</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white" id="fpIdentifierLabel">Email</label>
                                <input type="text" class="form-control" id="fpIdentifier" placeholder="Enter your email" required>
                                <div class="error-message"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-paper-plane me-2"></i>Generate Token
                            </button>

                            <div class="mt-3">
                                <div class="alert alert-warning py-2 mb-0 small" role="alert">
                                    Delivery via email/SMS is not configured yet. Token will be shown on screen for testing.
                                </div>
                            </div>
                        </form>

                        <div class="mt-3 d-none" id="fpTokenBox">
                            <div class="alert alert-info">
                                <div class="fw-bold mb-2">Reset token (copy this)</div>
                                <div class="d-flex gap-2 align-items-center">
                                    <input class="form-control" id="fpTokenValue" readonly>
                                    <button class="btn btn-outline-light" type="button" id="fpCopyTokenBtn"><i class="fas fa-copy"></i></button>
                                </div>
                                <div class="small mt-2" id="fpExpiresText"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <h5 class="text-white mb-3"><i class="fas fa-key me-2"></i>Reset password</h5>
                        <form id="resetPasswordForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label text-white">Token</label>
                                <input type="text" class="form-control" id="rpToken" placeholder="Paste token here" required>
                                <div class="error-message"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">New password</label>
                                <input type="password" class="form-control" id="rpNewPassword" placeholder="Enter new password" required>
                                <div class="error-message"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-white">Confirm new password</label>
                                <input type="password" class="form-control" id="rpConfirmPassword" placeholder="Confirm new password" required>
                                <div class="error-message"></div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-lock-open me-2"></i>Reset Password
                            </button>

                            <div class="text-center mt-3">
                                <a href="/" class="text-white" id="backToLoginLink">Back to login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='JS/api.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/forgot_password.js') }}"></script>
</body>
</html>
